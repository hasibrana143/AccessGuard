name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Resolve the pushed image reference
        id: image
        # A registry reference must be lowercase. `github.repository` keeps the
        # repository's original case (hasibrana143/AccessGuard), which the
        # metadata action lowercases internally but the scan steps below do
        # not — Trivy failed with "could not parse reference" on the uppercase
        # name. The sha tag is the image that was just pushed.
        run: |
          echo "ref=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):main-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        if: github.ref_type == 'branch'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # The action drops the severity filter in SARIF mode (the SARIF report
          # is meant to carry every severity), and the exit code then counts
          # every finding: the job failed on MEDIUM findings. With this flag the
          # filter is kept, so only HIGH/CRITICAL fail the gate and reach the
          # SARIF report.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          # The action's default (v0.70.0) has known path traversal advisories
          # (GHSA-mcj4-mphf-j9ff, GHSA-8rc5-4fr6-64pw); v0.76.2 is the current
          # release.
          version: v0.76.2

      - name: Upload Trivy SARIF
        if: github.ref_type == 'branch' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Syft SBOM attest
        if: github.ref_type == 'branch'
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.image.outputs.ref }}
