name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXTAUTH_SECRET: ci-secret-key-for-testing-only
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test
  LOG_LEVEL: error

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accessguard
          POSTGRES_PASSWORD: accessguard_secret
          POSTGRES_DB: accessguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U accessguard
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test

      - run: npm run db:constraints
        env:
          DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test

      - run: npm run db:seed
        env:
          DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test
          NEXTAUTH_SECRET: ci-secret-key-for-testing-only

      - run: npm run lint

      - run: npx vitest run --coverage
        env:
          DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test
          NEXTAUTH_SECRET: ci-secret-key-for-testing-only
          REDIS_URL: redis://localhost:6379

      - run: npm run build

      - run: npm audit --audit-level=high

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://accessguard:accessguard_secret@localhost:5432/accessguard_test
          NEXTAUTH_SECRET: ci-secret-key-for-testing-only
          NEXTAUTH_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
