services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: accessguard
      POSTGRES_PASSWORD: accessguard
      POSTGRES_DB: accessguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://accessguard:accessguard@postgres:5432/accessguard"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      # Split mode: web serves traffic only; scans run on `worker` below.
      # Single-container default keeps workers in-process — set this only
      # when running worker service(s) alongside.
      # DISABLE_BACKGROUND_WORKERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated scan workers: browser scans never compete with web traffic.
  # Scale out: `docker compose up --scale worker=3` (plus SCAN_WORKER_CONCURRENCY
  # per process). See docs/devops/SCALING.md. Profile-gated so the default
  # `docker compose up` stays single-container: `docker compose --profile workers up`.
  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: "postgresql://accessguard:accessguard@postgres:5432/accessguard"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      SCAN_WORKER_CONCURRENCY: "${SCAN_WORKER_CONCURRENCY:-6}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
